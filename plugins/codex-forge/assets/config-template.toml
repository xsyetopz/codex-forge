developer_instructions = @DEVELOPER_INSTRUCTIONS@
# Generated by Codex Forge setup. This block is managed by install.py.
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "high"
model_reasoning_summary = "none"
model_verbosity = "low"
service_tier = "flex"
model_instructions_file = "@MODEL_INSTRUCTIONS@"
experimental_compact_prompt_file = "@COMPACT_PROMPT@"
include_collaboration_mode_instructions = false
approval_policy = "on-request"
approvals_reviewer = "user"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true

[agents]


@AGENT_ROLES@

[apps._default]
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "high"
max_concurrent_threads_per_session = 3
max_depth = 1
default_tools_approval_mode = "writes"
destructive_enabled = false
open_world_enabled = false

[features]
fast_mode = false
personality = false
prevent_idle_sleep = true
local_thread_store_compression = true
apply_patch_preserve_line_endings = true
cwd_relative_turn_diffs = true
unified_image_budget = true

[features.token_budget]
enabled = true
