#:schema https://developers.openai.com/codex/config-schema.json
developer_instructions = @DEVELOPER_INSTRUCTIONS@
# Generated by Codex Forge setup. This block is managed by install.mjs.
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "medium"
model_reasoning_summary = "none"
model_verbosity = "low"
service_tier = "flex"
model_instructions_file = "@MODEL_INSTRUCTIONS@"
model_catalog_json = "@MODEL_CATALOG@"
experimental_compact_prompt_file = "@COMPACT_PROMPT@"
include_collaboration_mode_instructions = false
approval_policy = "on-request"
approvals_reviewer = "user"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true

[tui]
status_line = ["model-with-reasoning", "current-dir", "context-used", "used-tokens", "five-hour-limit", "weekly-limit"]
terminal_title = ["project", "git-branch", "status", "thread", "task-progress"]

[agents]
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "medium"
max_concurrent_threads_per_session = 8
max_depth = 1

[apps._default]
default_tools_approval_mode = "writes"
destructive_enabled = false
open_world_enabled = false

[features]
fast_mode = false
personality = false
prevent_idle_sleep = true
mcp_2026_07_28 = true
